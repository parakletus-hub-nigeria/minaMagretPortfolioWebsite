        <h2>About Professor Mina Margaret Ogbanga</h2>
        <p>
          Professor Mina Margaret Ogbanga is a renowned scholar, licensed social worker, researcher, and sustainable development activist.
          She serves as a Professor at Rivers State University in Port Harcourt, Nigeria, and faculty member at the Centre for Water and Sanitation Studies,
          as well as Global Associate at the School of Social Work, Indiana University–Purdue University Indianapolis (IUPUI).
          She completed executive studies at the University of Cambridge (UK) and Harvard University (USA), and holds a Ph.D. in Sustainable Development Studies.
        </p>
